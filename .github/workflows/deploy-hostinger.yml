name: Deploy to Hostinger

on:
  push:
    branches: [main, cursor/payday-calendar-b823]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack source
        run: git archive --format=zip --output=/tmp/payday-calendar.zip HEAD
      - name: Publish paycheck.tanmoybarua.com
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: node scripts/deploy-hostinger.mjs /tmp/payday-calendar.zip
