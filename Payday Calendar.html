<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Payday Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: summary band of paycheck cards on top; calendar left, day ledger right; stacks on phones */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#14211d; --muted:#5d6e68; --line:#dbe3e0;
  --accent:#0d7a5f; --accent-soft:#dff1ea; --pay:#c2700a; --pay-soft:#fdf0dc; --danger:#b4372d;
  --j0:#0d7a5f; --j1:#2f5fd0; --j2:#b0428f; --j3:#c2700a; --j4:#6d4fc2; --j5:#2a8a9c;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1614; --surface:#17211e; --ink:#e6eeeb; --muted:#93a59f; --line:#2a3833;
  --accent:#3fc29b; --accent-soft:#173a30; --pay:#f0a543; --pay-soft:#3a2a12; --danger:#ef7b70;
  --j0:#3fc29b; --j1:#7d9ff0; --j2:#e07cc4; --j3:#f0a543; --j4:#a891f0; --j5:#5cc3d4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1614; --surface:#17211e; --ink:#e6eeeb; --muted:#93a59f; --line:#2a3833;
  --accent:#3fc29b; --accent-soft:#173a30; --pay:#f0a543; --pay-soft:#3a2a12; --danger:#ef7b70;
  --j0:#3fc29b; --j1:#7d9ff0; --j2:#e07cc4; --j3:#f0a543; --j4:#a891f0; --j5:#5cc3d4; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:grid;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,5vw,36px);margin:0;letter-spacing:-.02em;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:18px;margin:0}
.sub{color:var(--muted);margin:2px 0 0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* paycheck cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;min-width:0}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.jobname{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.big{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:-.02em;line-height:1}
.countdown{background:var(--pay-soft);color:var(--pay);border-radius:999px;padding:3px 10px;font-weight:600;font-size:13px;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.stats div{display:grid;gap:2px}
.stats .v{font-family:var(--mono);font-weight:600;font-size:15px}
.note{font-size:13px;color:var(--muted)}
.today{background:var(--accent-soft);border-color:transparent}

/* main grid */
.main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.main{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:14px;min-width:0}
.calhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.calhead .nav{display:flex;align-items:center;gap:4px}
.month{font-family:var(--display);font-weight:600;font-size:20px;min-width:9.5em;text-align:center}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;font-weight:600;padding-bottom:2px}
.day{position:relative;border:1px solid var(--line);border-radius:8px;min-height:74px;padding:5px;display:flex;flex-direction:column;gap:2px;background:var(--surface);cursor:pointer;text-align:left;min-width:0}
.day:hover{border-color:var(--accent)}
.day.out{opacity:.4}
.day.inperiod{background:var(--accent-soft)}
.day.sel{outline:2px solid var(--accent);outline-offset:-2px}
.day .d{font-size:12px;font-weight:600}
.day.isToday .d{background:var(--ink);color:var(--surface);border-radius:999px;padding:0 6px;align-self:flex-start}
.day .amt{font-family:var(--mono);font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day .hrs{font-family:var(--mono);font-size:11px;color:var(--muted)}
.paytag{margin-top:auto;display:flex;flex-wrap:wrap;gap:2px}
.paytag span{font-size:9.5px;font-weight:700;letter-spacing:.05em;color:var(--surface);border-radius:4px;padding:0 4px}
@media (max-width:480px){.day{min-height:58px;padding:3px}.day .hrs{display:none}.day .amt{font-size:10.5px}}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}

/* ledger */
.entries{display:grid;gap:8px}
.entry{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.entry .num{font-weight:600}
form{display:grid;gap:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:420px){.row3{grid-template-columns:1fr 1fr}}
.field{display:grid;gap:4px;min-width:0}
.field input,.field select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);width:100%}
.hint{font-size:12px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.empty{border:1px dashed var(--line);border-radius:12px;padding:20px;display:grid;gap:10px;background:var(--surface)}
.jobs{display:grid;gap:8px}
.jobrow{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.jobrow .meta{font-size:13px;color:var(--muted)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches label{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;display:block}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches input:checked+label{border-color:var(--ink)}
.status{font-size:12px;color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
@media (prefers-reduced-motion:no-preference){.day,.btn{transition:border-color .15s}}

/* ---------- responsive ---------- */
header{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:6px 12px}
header .status{grid-column:1/-1;order:3}
.hdr-actions{display:flex;gap:8px;flex-wrap:wrap}
.caltools{display:flex;gap:8px;align-items:center;min-width:0}
.caltools select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--bg);max-width:100%;min-width:0}
.btn{min-height:40px}
.calhead .nav .btn{min-width:40px;font-size:20px;line-height:1;padding:6px 10px}
.entry .name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jobrow{flex-wrap:wrap}
.jobrow>div:first-child{flex:1 1 200px}

/* large screens: a little more room */
@media (min-width:1400px){
  .wrap{max-width:1320px}
  .day{min-height:92px}
  .day .amt{font-size:13px}
}
/* tablets & small laptops */
@media (max-width:1024px){
  .main{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
}
/* touch devices: comfortable tap targets, no iOS zoom on focus */
@media (pointer:coarse){
  .btn{min-height:44px}
  .field input,.field select,.caltools select{font-size:16px;min-height:44px}
  .day:hover{border-color:var(--line)}
}
/* tablets portrait & phones: one column */
@media (max-width:820px){
  .main{grid-template-columns:1fr}
  .cards{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
}
/* phones */
@media (max-width:640px){
  body{font-size:15px}
  .wrap{padding-block:14px calc(96px + env(safe-area-inset-bottom, 0px));gap:14px}
  header{grid-template-columns:1fr}
  header .status{order:0}
  .hdr-actions{
    position:fixed;left:0;right:0;bottom:0;z-index:10;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    background:var(--surface);border-top:1px solid var(--line);
    display:grid;grid-template-columns:1fr 1.4fr;gap:10px;
    box-shadow:0 -6px 20px rgb(0 0 0 / .08);
  }
  .hdr-actions .btn{min-height:48px;font-size:16px}
  .cards{grid-template-columns:1fr;gap:10px}
  .card,.panel{padding:14px;border-radius:10px}
  .big{font-size:30px}
  .calhead{display:grid;grid-template-columns:1fr;gap:8px}
  .calhead .nav{justify-content:space-between}
  .month{min-width:0;flex:1;font-size:18px}
  .caltools{justify-content:space-between}
  .caltools select{flex:1}
  .legend{gap:6px 12px;font-size:12px}
  .row{grid-template-columns:1fr}
  .actions .btn{flex:1}
  .entry{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"dot name del" ". amt amt";row-gap:2px}
  .entry .dot{grid-area:dot}.entry .name{grid-area:name}.entry .num{grid-area:amt}.entry .btn{grid-area:del;min-height:36px}
}
/* small phones */
@media (max-width:480px){
  .grid{gap:3px}
  .day{min-height:56px;padding:3px;border-radius:6px}
  .day .d{font-size:11px}
  .day .hrs{display:none}
  .day .amt{font-size:10px}
  .paytag span{font-size:8.5px;padding:0 3px}
  .dow{font-size:10px;letter-spacing:.02em}
  .stats .v{font-size:14px}
}
/* very narrow (older / folded phones) */
@media (max-width:360px){
  .wrap{padding-inline:12px}
  .grid{gap:2px}
  .day{min-height:48px;padding:2px}
  .day .amt{font-size:9px;letter-spacing:-.02em}
  .paytag span{font-size:0;width:8px;height:8px;border-radius:50%;padding:0}
  .hdr-actions{grid-template-columns:1fr 1fr}
}
/* phones held sideways: keep the bottom bar from eating the screen */
@media (max-height:480px) and (orientation:landscape){
  .hdr-actions{position:static;box-shadow:none;border:0;padding:0;background:transparent}
  .wrap{padding-block:12px 24px}
}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Payday Calendar</h1>
      <p class="sub" id="todayLine"></p>
    </div>
    <span class="status" id="status"></span>
    <div class="hdr-actions">
      <button class="btn" id="manageJobs" type="button">Pay schedules</button>
      <button class="btn primary" id="logToday" type="button">+ Log today</button>
    </div>
  </header>

  <section class="cards" id="cards" aria-label="Upcoming paychecks"></section>

  <div class="main">
    <section class="panel" aria-label="Calendar">
      <div class="calhead">
        <div class="nav">
          <button class="btn ghost" id="prev" type="button" aria-label="Previous month">‹</button>
          <div class="month" id="monthLabel"></div>
          <button class="btn ghost" id="next" type="button" aria-label="Next month">›</button>
        </div>
        <div class="caltools">
          <button class="btn ghost" id="goToday" type="button">Today</button>
          <select id="jobFilter" aria-label="Show pay period for"></select>
        </div>
      </div>
      <div class="grid" id="dows"></div>
      <div class="grid" id="cal"></div>
      <div class="legend" id="legend"></div>
    </section>

    <aside class="panel" id="side" aria-live="polite"></aside>
  </div>
</div>

<script>
(() => {
/* ---------- date helpers (all dates are "YYYY-MM-DD" strings, math in UTC) ---------- */
const P = s => { const [y,m,d] = s.split('-').map(Number); return new Date(Date.UTC(y, m-1, d)); };
const S = dt => dt.toISOString().slice(0,10);
const add = (s,n) => { const d = P(s); d.setUTCDate(d.getUTCDate()+n); return S(d); };
const diff = (a,b) => Math.round((P(b)-P(a))/864e5);
const lastDom = (y,m) => new Date(Date.UTC(y, m+1, 0)).getUTCDate(); // m 0-based
const ymd = (y,m,d) => S(new Date(Date.UTC(y,m,d)));
const localToday = () => { const n = new Date(); return ymd(n.getFullYear(), n.getMonth(), n.getDate()); };
const fmtLong = s => P(s).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:'UTC'});
const fmtShort = s => P(s).toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'});
const money = n => n.toLocaleString('en-US',{style:'currency',currency:'USD'});
const moneyShort = n => n >= 1000 ? '$' + (n/1000).toFixed(1) + 'k' : '$' + Math.round(n);
const hrs = n => (Math.round(n*100)/100) + 'h';

/* ---------- pay schedule math ---------- */
const FREQ = {biweeklyThu:'Every 2 weeks, paid Thursday of 3rd week', weekly:'Every week', biweekly:'Every 2 weeks', semimonthly:'15th & last day', monthly:'Once a month'};
const lagOf = job => job.freq==='biweeklyThu' ? (job.weekEnd==='sat' ? 5 : 4) : (Number(job.lag)||0);
function payOnOrAfter(job, s){
  const a = job.anchor;
  if (job.freq==='weekly' || job.freq==='biweekly' || job.freq==='biweeklyThu'){
    const step = job.freq==='weekly' ? 7 : 14;
    return add(a, Math.ceil(diff(a,s)/step)*step);
  }
  const d = P(s); let y = d.getUTCFullYear(), m = d.getUTCMonth();
  for (let i=0;i<3;i++){
    let cands;
    if (job.freq==='semimonthly') cands = [ymd(y,m,15), ymd(y,m,lastDom(y,m))];
    else { const dom = P(a).getUTCDate(); cands = [ymd(y,m,Math.min(dom,lastDom(y,m)))]; }
    for (const c of cands) if (c >= s) return c;
    m++; if (m>11){m=0;y++;}
  }
}
function payBefore(job, p){
  if (job.freq==='weekly') return add(p,-7);
  if (job.freq==='biweekly' || job.freq==='biweeklyThu') return add(p,-14);
  const d = P(p); let y = d.getUTCFullYear(), m = d.getUTCMonth();
  if (job.freq==='semimonthly'){
    if (d.getUTCDate()===15){ m--; if(m<0){m=11;y--;} return ymd(y,m,lastDom(y,m)); }
    return ymd(y,m,15);
  }
  m--; if(m<0){m=11;y--;}
  const dom = P(job.anchor).getUTCDate();
  return ymd(y,m,Math.min(dom,lastDom(y,m)));
}
function periodFor(job, payday){
  const lag = lagOf(job);
  return {start: add(payBefore(job,payday), -lag+1), end: add(payday,-lag), payday};
}
function periodContaining(job, day){
  // the paycheck whose work period includes `day`
  let p = payOnOrAfter(job, add(day, lagOf(job)));
  return periodFor(job, p);
}

/* ---------- state ---------- */
const state = {
  jobs: [], months: {}, // months["2026-10"] = {days:{ "2026-10-04":[{id,job,hours,amount}] }}
  view: null, selected: null, mode: 'day', editingJob: null, filter: null, confirmDel: null,
};
let store = null; // {saveJobs(jobs), saveMonth(key, days)}
const today = localToday();
state.view = today.slice(0,7);
state.selected = today;

const uid = () => Math.random().toString(36).slice(2,9);
const entriesOn = s => (state.months[s.slice(0,7)]?.days?.[s]) || [];
const jobById = id => state.jobs.find(j => j.id===id);
const jobColor = j => `var(--j${(j?.color ?? 0)})`;

function totals(from, to, jobId){
  let h=0, a=0;
  for (const mk in state.months){
    const days = state.months[mk].days || {};
    for (const d in days){
      if (d < from || d > to) continue;
      for (const e of days[d]) if (!jobId || e.job===jobId){ h += Number(e.hours)||0; a += Number(e.amount)||0; }
    }
  }
  return {h, a};
}

/* ---------- rendering ---------- */
const $ = id => document.getElementById(id);
const el = (tag, attrs={}, ...kids) => {
  const n = document.createElement(tag);
  for (const k in attrs){
    if (k==='class') n.className = attrs[k];
    else if (k==='style') n.setAttribute('style', attrs[k]);
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k]!==undefined && attrs[k]!==null && attrs[k]!==false) n.setAttribute(k, attrs[k]===true?'':attrs[k]);
  }
  for (const c of kids.flat()) if (c!=null && c!==false) n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
};

function renderCards(){
  const box = $('cards'); box.replaceChildren();
  const t = totals(today, today);
  box.append(el('div',{class:'card today'},
    el('div',{class:'top'}, el('span',{class:'label'},'Today'), el('span',{class:'note'}, fmtLong(today))),
    el('div',{class:'big num'}, money(t.a)),
    el('div',{class:'note'}, t.h ? `${hrs(t.h)} worked today` : 'Nothing logged yet today')
  ));
  if (!state.jobs.length){
    box.append(el('div',{class:'empty'},
      el('h2',{},'Add your pay schedule'),
      el('p',{class:'note',style:'margin:0'},'Tell the calendar when you get paid (weekly, every 2 weeks, twice a month or monthly) and one recent payday. It will mark every upcoming payday and add up what you earn toward each one.'),
      el('div',{}, el('button',{class:'btn primary',type:'button',onclick:()=>openJobForm(null)},'Add pay schedule'))
    ));
    return;
  }
  for (const j of state.jobs){
    const next = payOnOrAfter(j, today);
    const per = periodFor(j, next);
    const t = totals(per.start, per.end, j.id);
    const days = diff(today, next);
    const cd = days===0 ? 'Payday today' : days===1 ? 'Tomorrow' : `In ${days} days`;
    const after = today > per.end;
    const nextPer = after ? periodFor(j, payOnOrAfter(j, add(next,1))) : null;
    const t2 = nextPer ? totals(nextPer.start, nextPer.end, j.id) : null;
    box.append(el('div',{class:'card'},
      el('div',{class:'top'},
        el('span',{class:'jobname'}, el('span',{class:'dot',style:`background:${jobColor(j)}`}), el('span',{style:'overflow:hidden;text-overflow:ellipsis;white-space:nowrap'}, j.name)),
        el('span',{class:'countdown'}, cd)),
      el('div',{}, el('div',{class:'label'},'Next paycheck · ' + fmtLong(next)), el('div',{class:'big num',style:'margin-top:4px'}, money(t.a))),
      el('div',{class:'stats'},
        el('div',{}, el('span',{class:'label'},'Hours'), el('span',{class:'v'}, hrs(t.h))),
        el('div',{}, el('span',{class:'label'},'Per hour'), el('span',{class:'v'}, t.h ? money(t.a/t.h) : '—')),
        el('div',{}, el('span',{class:'label'},'Days'), el('span',{class:'v'}, workDays(per.start, per.end, j.id)))),
      el('div',{class:'note'}, `Covers work ${fmtShort(per.start)} – ${fmtShort(per.end)}` + (j.rate ? ` · ${money(Number(j.rate))}/h` : '')),
      after ? el('div',{class:'note'}, `Work from today counts toward ${fmtShort(nextPer.payday)} (so far ${money(t2.a)}).`) : null
    ));
  }
}
function workDays(from,to,jobId){
  let n=0; for (let d=from; d<=to; d=add(d,1)) if (entriesOn(d).some(e=>!jobId||e.job===jobId)) n++; return n;
}

function renderCalendar(){
  const [y,m] = state.view.split('-').map(Number);
  $('monthLabel').textContent = new Date(Date.UTC(y,m-1,1)).toLocaleDateString('en-US',{month:'long',year:'numeric',timeZone:'UTC'});
  const first = ymd(y,m-1,1);
  const start = add(first, -P(first).getUTCDay());
  const end = add(start, 41);
  // paydays in range
  const pays = {};
  for (const j of state.jobs){
    let p = payOnOrAfter(j, start), guard=0;
    while (p <= end && guard++ < 60){ (pays[p] ||= []).push(j); p = payOnOrAfter(j, add(p,1)); }
  }
  // highlighted period
  const fj = jobById(state.filter);
  let per = null;
  if (fj) per = periodFor(fj, payOnOrAfter(fj, today));
  const cal = $('cal'); cal.replaceChildren();
  for (let i=0;i<42;i++){
    const d = add(start,i);
    const list = entriesOn(d).filter(e => !fj || e.job===fj.id);
    const a = list.reduce((s,e)=>s+(Number(e.amount)||0),0);
    const h = list.reduce((s,e)=>s+(Number(e.hours)||0),0);
    const cls = ['day'];
    if (d.slice(0,7)!==state.view) cls.push('out');
    if (d===today) cls.push('isToday');
    if (d===state.selected) cls.push('sel');
    if (per && d>=per.start && d<=per.end) cls.push('inperiod');
    const pj = (pays[d]||[]).filter(j => !fj || j.id===fj.id);
    cal.append(el('button',{type:'button',class:cls.join(' '),'aria-label':fmtLong(d) + (a?`, ${money(a)}`:'') + (pj.length?', payday':''),
      onclick:()=>{ state.selected=d; state.mode='day'; if (d.slice(0,7)!==state.view) state.view=d.slice(0,7); render(); focusForm(); }},
      el('span',{class:'d'}, P(d).getUTCDate()),
      a ? el('span',{class:'amt',style:'color:var(--accent)'}, moneyShort(a)) : null,
      h ? el('span',{class:'hrs'}, hrs(h)) : null,
      pj.length ? el('span',{class:'paytag'}, pj.map(j => el('span',{style:`background:${jobColor(j)}`,title:`${j.name} payday`},'PAY'))) : null
    ));
  }
  const lg = $('legend'); lg.replaceChildren(
    el('span',{}, el('i',{style:'background:var(--accent-soft);border:1px solid var(--line)'}), fj ? `Work counting toward next ${fj.name} paycheck` : 'Pick a schedule to shade its pay period'),
    el('span',{}, el('i',{style:'background:var(--pay)'}), 'PAY = payday'),
    el('span',{}, el('i',{style:'background:var(--ink)'}), 'Today'));
  const sel = $('jobFilter'); sel.replaceChildren(
    el('option',{value:''},'All schedules'),
    ...state.jobs.map(j => el('option',{value:j.id, selected: j.id===state.filter}, j.name)));
  sel.hidden = !state.jobs.length;
}

function renderSide(){
  const side = $('side'); side.replaceChildren();
  if (state.mode==='jobs') return renderJobs(side);
  if (state.mode==='jobform') return renderJobForm(side);
  const d = state.selected;
  const list = entriesOn(d);
  const tot = list.reduce((s,e)=>({a:s.a+(Number(e.amount)||0), h:s.h+(Number(e.hours)||0)}),{a:0,h:0});
  side.append(el('div',{},
    el('div',{class:'label'}, d===today ? 'Today' : 'Day'),
    el('h2',{style:'font-size:22px'}, fmtLong(d)),
    el('div',{class:'note num'}, `${money(tot.a)} · ${hrs(tot.h)}`)));
  // which paycheck(s) this day counts toward
  if (state.jobs.length){
    side.append(el('div',{class:'note'}, state.jobs.map(j => {
      const per = periodContaining(j, d);
      const t = totals(per.start, per.end, j.id);
      const past = per.payday < today;
      return el('div',{}, el('span',{class:'dot',style:`display:inline-block;margin-right:6px;background:${jobColor(j)}`}),
        `${j.name}: ${past ? 'was paid' : 'paid'} ${fmtLong(per.payday)} · that check: `,
        el('strong',{class:'num'}, money(t.a)), ` (${hrs(t.h)}, ${fmtShort(per.start)}–${fmtShort(per.end)})`);
    })));
  }
  if (state.flash){ side.append(el('div',{class:'note',style:'color:var(--accent);font-weight:600'}, state.flash)); }
  const ents = el('div',{class:'entries'});
  for (const e of list){
    const j = jobById(e.job);
    ents.append(el('div',{class:'entry'},
      el('span',{class:'dot',style:`background:${jobColor(j)}`}),
      el('span',{class:'name'}, j ? j.name : 'Removed schedule'),
      el('span',{class:'num'}, `${hrs(Number(e.hours)||0)} · ${money(Number(e.amount)||0)}`),
      el('button',{class:'btn ghost danger',type:'button','aria-label':'Delete entry',onclick:()=>deleteEntry(d,e.id)},'✕')));
  }
  if (list.length) side.append(ents);
  if (!state.jobs.length){
    side.append(el('p',{class:'note',style:'margin:0'},'Add a pay schedule first, then log hours and pay here.'),
      el('div',{}, el('button',{class:'btn primary',type:'button',onclick:()=>openJobForm(null)},'Add pay schedule')));
    return;
  }
  // add form
  const f = el('form',{id:'logForm'});
  const dIn = el('input',{id:'eDate',type:'date',value:d,max:add(today,60),required:true});
  dIn.addEventListener('change', () => {
    if (!dIn.value) return;
    state.selected = dIn.value; state.view = dIn.value.slice(0,7);
    render(); setTimeout(()=>{ const h=$('eHours'); if(h) h.focus(); },0);
  });
  const jobSel = el('select',{id:'eJob'}, state.jobs.map(j=>el('option',{value:j.id},j.name)));
  const hIn = el('input',{id:'eHours',type:'number',min:'0',step:'0.25',inputmode:'decimal',placeholder:'0'});
  const aIn = el('input',{id:'eAmount',type:'number',min:'0',step:'0.01',inputmode:'decimal',placeholder:'0.00'});
  const hint = el('div',{class:'hint'});
  const updHint = () => {
    const j = jobById(jobSel.value);
    hint.textContent = j?.rate ? `Leave pay empty to use ${money(Number(j.rate))}/h. Add tips to the pay amount.` : 'Enter what you earned this day, tips included.';
  };
  jobSel.addEventListener('change', updHint); updHint();
  f.append(el('h2',{},'Log work'),
    el('div',{class:'field'}, el('label',{class:'label',for:'eDate'},'Date worked'), dIn,
      el('div',{class:'hint'},'Pick any past day to add old hours. You can also tap a day on the calendar.')),
    state.jobs.length>1 ? el('div',{class:'field'}, el('label',{class:'label',for:'eJob'},'Schedule'), jobSel) : '',
    el('div',{class:'row'},
      el('div',{class:'field'}, el('label',{class:'label',for:'eHours'},'Hours'), hIn),
      el('div',{class:'field'}, el('label',{class:'label',for:'eAmount'},'Pay ($)'), aIn)),
    hint,
    el('div',{class:'actions'}, el('button',{class:'btn primary',type:'submit'},'Add to ' + fmtShort(d))));
  if (state.jobs.length===1) jobSel.value = state.jobs[0].id;
  f.addEventListener('submit', ev => {
    ev.preventDefault();
    const j = jobById(state.jobs.length>1 ? jobSel.value : state.jobs[0].id);
    const h = parseFloat(hIn.value)||0;
    let a = aIn.value==='' ? (j.rate ? h*Number(j.rate) : 0) : parseFloat(aIn.value)||0;
    if (!h && !a){ hint.textContent = 'Enter hours, pay, or both.'; hint.style.color='var(--danger)'; return; }
    const day = dIn.value || d;
    flash(`Added ${hrs(h)} · ${money(a)} to ${fmtShort(day)}`);
    state.selected = day; state.view = day.slice(0,7);
    addEntry(day, {id:uid(), job:j.id, hours:h, amount:Math.round(a*100)/100});
    focusForm();
  });
  side.append(f);
}

function renderJobs(side){
  side.append(el('div',{style:'display:flex;justify-content:space-between;align-items:center;gap:8px'},
    el('h2',{},'Pay schedules'),
    el('button',{class:'btn ghost',type:'button',onclick:()=>{state.mode='day';render();}},'Done')));
  const box = el('div',{class:'jobs'});
  for (const j of state.jobs){
    const confirming = state.confirmDel===j.id;
    box.append(el('div',{class:'jobrow'},
      el('div',{style:'min-width:0'},
        el('div',{class:'jobname'}, el('span',{class:'dot',style:`background:${jobColor(j)}`}), j.name),
        el('div',{class:'meta'}, `${FREQ[j.freq]} · next ${fmtShort(payOnOrAfter(j,today))}` +
          (j.freq==='biweeklyThu' ? ` · weeks end ${j.weekEnd==='sat'?'Saturday':'Sunday'}` : (j.lag?` · ${j.lag}-day delay`:'')))),
      confirming
        ? el('div',{class:'confirm'}, 'Remove?',
            el('button',{class:'btn danger',type:'button',onclick:()=>removeJob(j.id)},'Remove'),
            el('button',{class:'btn ghost',type:'button',onclick:()=>{state.confirmDel=null;render();}},'Keep'))
        : el('div',{style:'display:flex;gap:4px'},
            el('button',{class:'btn ghost',type:'button',onclick:()=>openJobForm(j.id)},'Edit'),
            el('button',{class:'btn ghost danger',type:'button',onclick:()=>{state.confirmDel=j.id;render();}},'Remove'))));
  }
  side.append(box, el('div',{}, el('button',{class:'btn primary',type:'button',onclick:()=>openJobForm(null)},'+ Add pay schedule')));
}

function nextWeekday(dow){ let d = today; while (P(d).getUTCDay()!==dow) d = add(d,1); return d; }
function lastWeekday(dow){ let d = today; while (P(d).getUTCDay()!==dow) d = add(d,-1); return d; }
function renderJobForm(side){
  const j = jobById(state.editingJob) || {name:'', freq:'biweeklyThu', anchor: lastWeekday(4), weekEnd:'sun', lag:0, rate:'', color: state.jobs.length % 6};
  const f = el('form',{});
  const sw = el('div',{class:'swatches',role:'radiogroup','aria-label':'Color'});
  for (let i=0;i<6;i++){
    sw.append(el('input',{type:'radio',name:'jColor',id:'jc'+i,value:i,checked:Number(j.color)===i}),
      el('label',{for:'jc'+i,style:`background:var(--j${i})`,title:'Color '+(i+1)}));
  }
  const freq = el('select',{id:'jFreq'}, Object.entries(FREQ).map(([k,v])=>el('option',{value:k,selected:j.freq===k},v)));
  const anchorLabel = el('label',{class:'label',for:'jAnchor'});
  const anchorHint = el('div',{class:'hint'});
  const anchorIn = el('input',{id:'jAnchor',type:'date',value:j.anchor,required:true});
  const anchorField = el('div',{class:'field'}, anchorLabel, anchorIn, anchorHint);
  const weekEnd = el('select',{id:'jWeekEnd'},
    el('option',{value:'sun',selected:j.weekEnd!=='sat'},'Sunday (weeks run Mon–Sun)'),
    el('option',{value:'sat',selected:j.weekEnd==='sat'},'Saturday (weeks run Sun–Sat)'));
  const weekEndField = el('div',{class:'field'}, el('label',{class:'label',for:'jWeekEnd'},'Your work week ends on'), weekEnd,
    el('div',{class:'hint'},'You work 2 weeks, then get paid on Thursday of the next week.'));
  const lagField = el('div',{class:'field'}, el('label',{class:'label',for:'jLag'},'Delay (days)'),
    el('input',{id:'jLag',type:'number',min:'0',max:'30',step:'1',value:j.lag||0}),
    el('div',{class:'hint'},'Days between the last day of work counted and payday. 0 if work up to payday counts.'));
  const syncAnchor = () => {
    const thu = freq.value==='biweeklyThu';
    anchorField.hidden = freq.value==='semimonthly';
    weekEndField.hidden = !thu; lagField.hidden = thu;
    anchorLabel.textContent = thu ? 'Your last payday (a Thursday)' : 'A payday (past or next)';
    const notThu = thu && anchorIn.value && P(anchorIn.value).getUTCDay()!==4;
    anchorHint.textContent = notThu ? 'That date is not a Thursday. Pick the Thursday you were paid.' : 'Any real payday works. The calendar repeats it on your schedule.';
    anchorHint.style.color = notThu ? 'var(--danger)' : '';
  };
  freq.addEventListener('change', syncAnchor); anchorIn.addEventListener('input', syncAnchor); syncAnchor();
  f.append(
    el('div',{style:'display:flex;justify-content:space-between;align-items:center'},
      el('h2',{}, state.editingJob ? 'Edit schedule' : 'New pay schedule'),
      el('button',{class:'btn ghost',type:'button',onclick:()=>{state.mode = state.jobs.length?'jobs':'day';render();}},'Cancel')),
    el('div',{class:'field'}, el('label',{class:'label',for:'jName'},'Name'),
      el('input',{id:'jName',type:'text',value:j.name,placeholder:'e.g. DoorDash, Uber, Day job',required:true,maxlength:'40'})),
    el('div',{class:'field'}, el('label',{class:'label',for:'jFreq'},'How often you get paid'), freq),
    anchorField,
    weekEndField,
    el('div',{class:'row'},
      lagField,
      el('div',{class:'field'}, el('label',{class:'label',for:'jRate'},'Hourly rate ($, optional)'),
        el('input',{id:'jRate',type:'number',min:'0',step:'0.01',value:j.rate||'',placeholder:'—'}),
        el('div',{class:'hint'},'Fills in pay from hours when you leave pay empty.'))),
    el('div',{class:'field'}, el('span',{class:'label'},'Color'), sw),
    el('div',{class:'actions'}, el('button',{class:'btn primary',type:'submit'},'Save schedule')));
  f.addEventListener('submit', ev => {
    ev.preventDefault();
    const data = {
      id: j.id || uid(), name: $('jName').value.trim() || 'My job', freq: freq.value,
      anchor: freq.value==='semimonthly' ? today : ($('jAnchor').value || today),
      lag: Math.max(0, parseInt($('jLag').value)||0), weekEnd: weekEnd.value, rate: $('jRate').value==='' ? '' : Number($('jRate').value),
      color: Number((f.querySelector('input[name=jColor]:checked')||{}).value||0),
    };
    const jobs = state.jobs.filter(x=>x.id!==data.id).concat(data);
    jobs.sort((a,b)=> state.jobs.findIndex(x=>x.id===a.id) - state.jobs.findIndex(x=>x.id===b.id));
    state.jobs = jobs; if (!state.filter) state.filter = data.id;
    state.mode = 'jobs'; state.editingJob = null;
    store.saveJobs(jobs); render();
  });
  side.append(f);
  setTimeout(()=>{ try{ $('jName').focus(); }catch(e){} }, 0);
}

let flashTimer;
function flash(msg){
  state.flash = msg; clearTimeout(flashTimer);
  flashTimer = setTimeout(()=>{ state.flash=null; if (state.mode==='day') renderSide(); }, 4000);
}
function focusForm(){
  setTimeout(()=>{
    const side = $('side');
    if (window.matchMedia('(max-width:820px)').matches){
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      side.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block:'start'});
    }
    const h = $('eHours'); if (h) h.focus({preventScroll:true});
  },0);
}
function openJobForm(id){ state.editingJob = id; state.mode='jobform'; render(); }
function removeJob(id){
  state.jobs = state.jobs.filter(j=>j.id!==id); state.confirmDel=null;
  if (state.filter===id) state.filter = state.jobs[0]?.id || null;
  store.saveJobs(state.jobs); render();
}
function addEntry(d, e){
  const mk = d.slice(0,7);
  const m = state.months[mk] = {days: {...(state.months[mk]?.days||{})}};
  m.days[d] = [...(m.days[d]||[]), e];
  store.saveMonth(mk, m.days); render();
}
function deleteEntry(d, id){
  const mk = d.slice(0,7);
  const days = {...(state.months[mk]?.days||{})};
  days[d] = (days[d]||[]).filter(e=>e.id!==id);
  if (!days[d].length) delete days[d];
  state.months[mk] = {days};
  store.saveMonth(mk, days); render();
}

function render(){
  $('todayLine').textContent = `Today is ${P(today).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'})}`;
  renderCards(); renderCalendar(); renderSide();
}

/* ---------- static bits & events ---------- */
$('dows').append(...['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>el('div',{class:'dow'},d)));
const shiftMonth = n => { let [y,m]=state.view.split('-').map(Number); m+=n; if(m<1){m=12;y--;} if(m>12){m=1;y++;} state.view = `${y}-${String(m).padStart(2,'0')}`; render(); };
// swipe left/right on the calendar to change month
(() => {
  let x0=null, y0=null;
  const cal = $('cal');
  cal.addEventListener('touchstart', e => { const t=e.touches[0]; x0=t.clientX; y0=t.clientY; }, {passive:true});
  cal.addEventListener('touchend', e => {
    if (x0===null) return;
    const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0; x0=null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.5) shiftMonth(dx < 0 ? 1 : -1);
  }, {passive:true});
})();
$('prev').onclick = () => shiftMonth(-1);
$('next').onclick = () => shiftMonth(1);
$('goToday').onclick = () => { state.view = today.slice(0,7); state.selected = today; state.mode='day'; render(); };
$('logToday').onclick = () => { state.view = today.slice(0,7); state.selected = today; state.mode='day'; render(); focusForm(); };
$('manageJobs').onclick = () => { state.mode = state.jobs.length ? 'jobs' : 'jobform'; state.editingJob=null; render(); };
$('jobFilter').onchange = e => { state.filter = e.target.value || null; render(); };

/* ---------- storage: private per-person db, local fallback ---------- */
const setStatus = t => { $('status').textContent = t; };
function localStore(){
  const KEY='payday-cal-v1';
  try { const s = JSON.parse(localStorage.getItem(KEY)||'null'); if (s){ state.jobs=s.jobs||[]; state.months=s.months||{}; } } catch(e){}
  const persist = () => { try{ localStorage.setItem(KEY, JSON.stringify({jobs:state.jobs, months:state.months})); }catch(e){} };
  return {saveJobs: persist, saveMonth: persist};
}
// Built-in company schedule: 2-week periods, paid Thursday of the 3rd week; last payday Thu Oct 1, 2026
const companySchedule = () => ({id:'company', name:'My company', freq:'biweeklyThu', anchor:'2026-10-01', weekEnd:'sun', lag:0, rate:'', color:0});
// Convert an earlier plain "every 2 weeks, no delay" schedule on the company's Thursdays (in step with Oct 1)
// into the company schedule, keeping its name, rate and color.
let migrated = false;
function migrateCompany(){
  if (migrated) return false;
  migrated = true;
  let changed = false;
  state.jobs = state.jobs.map(j => {
    const onCompanyThursdays = j.anchor && P(j.anchor).getUTCDay()===4 && Math.abs(diff('2026-10-01', j.anchor)) % 14 === 0;
    if (j.freq==='biweekly' && !(Number(j.lag)>0) && onCompanyThursdays){
      changed = true;
      return {...j, freq:'biweeklyThu', anchor:'2026-10-01', weekEnd:'sun', lag:0};
    }
    return j;
  });
  if (changed) store.saveJobs(state.jobs);
  return changed;
}
let seeded = false;
function seedIfEmpty(){
  if (seeded || state.jobs.length) return;
  seeded = true;
  state.jobs = [companySchedule()]; state.filter = 'company';
  store.saveJobs(state.jobs);
}
store = localStore();
state.filter = state.jobs[0]?.id || null;
render();

(async () => {
  const localOnly = () => { setStatus('Saved in this browser only'); migrateCompany(); seedIfEmpty(); render(); };
  if (!window.claude?.use) return localOnly();
  const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
  const id = user ? await user.id() : null;
  if (!db || !id) return localOnly();
  const col = db.collection('data/users/' + id);
  const queues = {};
  const write = (docId, body) => {
    queues[docId] = (queues[docId] || Promise.resolve()).then(() => col.doc(docId).set(body)).then(
      () => setStatus('Saved'),
      e => setStatus(e?.code==='quota_exceeded' ? 'Storage is full' : 'Could not save, try again'));
    setStatus('Saving…');
  };
  store = {
    saveJobs: jobs => write('settings', {jobs}),
    saveMonth: (mk, days) => write('m-' + mk, {days}),
  };
  let first = true;
  col.onSnapshot(snap => {
    const months = {}; let jobs = [];
    for (const d of snap.docs){
      const data = d.data() || {};
      if (d.id==='settings') jobs = Array.isArray(data.jobs) ? data.jobs : [];
      else if (d.id.startsWith('m-')) months[d.id.slice(2)] = {days: data.days || {}};
    }
    state.jobs = jobs; state.months = months;
    if (!snap.metadata.fromCache && !snap.metadata.hasPendingWrites){ migrateCompany(); seedIfEmpty(); }
    if (!state.jobs.find(j=>j.id===state.filter)) state.filter = state.jobs[0]?.id || null;
    if (first){ first = false; setStatus('Synced to your account'); if (!jobs.length && state.mode==='day') { /* keep empty state */ } }
    // don't wipe a form the person is typing in
    const typing = document.activeElement && /INPUT|SELECT/.test(document.activeElement.tagName) && $('side').contains(document.activeElement);
    if (typing){ renderCards(); renderCalendar(); } else render();
  }, () => setStatus('Offline, changes may not save'));
})();
})();
</script>

</body></html>
